name: Withdraw Gpk 1.0.2
on:
  push:
    paths: ['.github/workflows/quarantine-1.0.2.yml']
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    if: github.repository == 'trgiang1008/gpk-releases'
    steps:
      - name: Keep faulty build as prerelease, remove stable eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v1.0.2 --prerelease --latest=false --title 'Gpk 1.0.2 - withdrawn (helper mismatch)'
